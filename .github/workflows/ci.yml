# Both target platforms on every change. There is no cross-compiling here: the
# webview is the system's own (WebKit on macOS, WebView2 on Windows), so a build
# only proves anything on the machine it targets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The frontend has to be built first: main.go embeds frontend/dist, which
      # is gitignored, so `go build` on a fresh clone fails without this.
      - name: Build the frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
